[platformio]
default_envs = openremote_dock
src_dir = pio_src

[env:openremote_dock]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

; ESP32-C3 Super Mini: single-core RISC-V, 4MB flash, 400KB SRAM, no PSRAM.
board_build.flash_mode = dio
; Reclaims the 1.5MB SPIFFS partition the dock has never used and gives it to
; the two app slots - see partitions.csv. Needs one USB flash to take effect.
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; Pinned to the dock, for the same reason the remote's ini pins its own port:
; both boards are Espressif and share a USB vendor id, so PlatformIO's
; auto-detection can land on the remote and try to flash an ESP32-C3 image
; into an ESP32-S3. The dock is the /dev/cu.usbmodem* entry; the remote is the
; usbserial one. A literal name, not a glob - this platform hands upload_port
; straight to esptool without expanding wildcards.
;
; The suffix is assigned per USB socket, so moving the cable renames it. Run
; "pio device list" and update both lines if that happens.
upload_port = /dev/cu.usbmodem13201
monitor_port = /dev/cu.usbmodem13201
upload_speed = 921600
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_ldf_mode = deep

; Same version the remote firmware uses, so both encode identically.
; HTTPClient and WiFi are Arduino-ESP32 bundled libraries, but this project
; sets lib_ldf_mode = deep and they are only reachable once named here.
; Needed for the Homebridge relay: the dock issues the HTTP calls itself.
lib_deps =
    HTTPClient
    WiFi
    NetworkClientSecure
    knolleary/PubSubClient@2.8
    links2004/WebSockets@2.6.1
    z3t0/IRremote@4.7.1
    ; CC1101 433MHz transceiver. Used in asynchronous serial mode rather than
    ; its packet engine, because a garage/gate remote is a raw OOK edge train
    ; with no framing the chip could parse - the same shape of problem as raw
    ; IR, and captured and replayed the same way.
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git

build_flags =
    ; Protocol encoders shared with the other firmware - one implementation,
    ; compiled into both, so the two can never drift apart.
    -I../../shared
    ; The Super Mini has no USB-serial bridge - the C3's own USB pins are the
    ; only port - so without CDC on boot there is no serial output at all.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Preserve the Super Mini's own active-low GPIO8 LED and GPIO9 BOOT button.
    ; The Rev 6 PCB adds an active-high D5 LED on GPIO1 and an active-low SW1 on
    ; GPIO3. Both LEDs mirror one another and either button operates the same
    ; identify / pair / forget gesture state machine.
    -DDOCK_LED_PIN=8
    -DDOCK_AUX_LED_PIN=1
    -DDOCK_BUTTON_PIN=9
    -DDOCK_MENU_BUTTON_PIN=3
    -DDOCK_LED_ACTIVE_LOW=1
    -DDOCK_AUX_LED_ACTIVE_LOW=0
    ; Rev 6 IR driver. IRremote's default output is active HIGH, matching the
    ; GPIO0 -> 100R -> paralleled FS8205A gates. The MOSFETs then pull IR_K low
    ; and light the four separately-resistored emitters from +5V.
    -DDOCK_IR_LED_PIN=0
    ;
    ; Generate the 38kHz carrier with the LEDC peripheral instead of software.
    ;
    ; Without this IRremote bit-bangs the carrier with delayMicroseconds(), and
    ; a 38kHz half-period is 13us. That is survivable on the remote - a
    ; dual-core S3 at 240MHz - but not here: the C3 is single core at 160MHz
    ; and is simultaneously running Wi-Fi, MQTT, a Home Assistant WebSocket and
    ; ESP-NOW, and every Wi-Fi interrupt lands squarely inside a carrier pulse.
    ; The mark/space envelope still came out right, because those are hundreds
    ; of microseconds and a few lost are neither here nor there - so the
    ; emitter visibly blinked and looked perfect on a phone camera - while the
    ; carrier underneath it was jittered far enough that a receiver's 38kHz
    ; bandpass filter threw the whole thing away. Identical commands worked
    ; from the remote's own emitter and did nothing from the dock's.
    ;
    ; With the carrier in hardware it is exact regardless of what the CPU is
    ; doing, and only the envelope is left to software, which is the part
    ; software is actually good enough for. The dock never receives IR (no
    ; IrReceiver anywhere in its firmware), so the timer is free.
    -DSEND_PWM_BY_TIMER
    ; ---------------------------------------------------------------------
    ; CC1101 433MHz module (SPI). Wire VCC to 3V3 - NOT 5V, the part is
    ; 1.9-3.6V and 5V will destroy it. GND to GND.
    ;
    ; These are the ESP32-C3's default SPI pins, so the hardware peripheral is
    ; used rather than bit-banged. GPIO2, 8 and 9 are deliberately avoided:
    ; all three are strapping pins read at reset, and 8 and 9 already carry
    ; the status LED and the button.
    ;
    ;   CC1101        C3 Super Mini
    ;   VCC     ....  3V3
    ;   GND     ....  GND
    ;   SCK     ....  GPIO4
    ;   MISO    ....  GPIO5
    ;   MOSI    ....  GPIO6
    ;   CSN     ....  GPIO7
    ;   GDO0    ....  GPIO10  data in/out, the pin that actually carries OOK
    ;   GDO2    ....  GPIO20  optional, -1 to leave it unconnected
    ;
    ; GDO0 is the one that matters: in async mode it is the CC1101's data
    ; line, an output while receiving and an input while transmitting.
    -DDOCK_RF_SCK_PIN=4
    -DDOCK_RF_MISO_PIN=5
    -DDOCK_RF_MOSI_PIN=6
    -DDOCK_RF_CS_PIN=7
    -DDOCK_RF_GDO0_PIN=10
    -DDOCK_RF_GDO2_PIN=20
    ; 433.92MHz is what nearly every gate, garage and socket remote uses.
    -DDOCK_RF_FREQ_MHZ=433.92
