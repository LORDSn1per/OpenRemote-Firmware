[platformio]
default_envs = openremote_rev5
src_dir = pio_src

[env:openremote_rev5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Pinned to the remote so that having the dock plugged in at the same time
; cannot confuse the upload. Both boards are Espressif and share a USB vendor
; id, so PlatformIO's own auto-detection can land on the dock and then try to
; flash an ESP32-S3 image into an ESP32-C3.
;
; A literal name, NOT a glob. This platform hands upload_port straight to
; esptool without expanding wildcards, so "/dev/cu.usbserial*" is passed
; through as text and fails with "No such file or directory" no matter what is
; connected. The monitor does expand patterns, but there is no sense in the two
; settings disagreeing about which port they mean.
;
; cu, not tty: on macOS the tty device asserts carrier-detect and a monitor can
; block waiting for a DCD the bridge never raises, which looks like a dead port.
;
; If the suffix ever changes - it is assigned per USB socket, so moving the
; cable renames it - run "pio device list" and update both lines. The dock is
; the /dev/cu.usbmodem* entry; the remote is the usbserial one.
upload_port = /dev/cu.usbserial-1330
monitor_port = /dev/cu.usbserial-1330
upload_speed = 460800
monitor_speed = 460800
monitor_filters = time, esp32_exception_decoder
lib_ldf_mode = deep

lib_deps =
    bblanchon/ArduinoJson@7.4.2
    z3t0/IRremote@4.7.1
    lovyan03/LovyanGFX@1.2.26
    moononournation/GFX Library for Arduino@1.6.6
    lvgl/lvgl@8.3.11

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_PARTITION_default_8MB
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    ; ArduinoJson sizes both of these from the pointer width, so a 32-bit
    ; target gets uint16_t for each: a single string value is capped at 65535
    ; characters and a document at 65535 slots. A backup embeds theme
    ; wallpapers as base64 - a 240x320 RGB565 image is 153600 bytes, or 204800
    ; base64 characters - so StringNode::create() returned nullptr on the very
    ; first wallpaper and the restore failed as NoMemory with 7.7 MB of PSRAM
    ; free, because the length check happens before any allocation is
    ; attempted. 4 bytes each lifts both ceilings past anything the card can
    ; hold; the cost is a wider slot and two more bytes per string header,
    ; which this board has 8 MB of PSRAM to absorb.
    -DARDUINOJSON_STRING_LENGTH_SIZE=4
    -DARDUINOJSON_SLOT_ID_SIZE=4
    -I.
