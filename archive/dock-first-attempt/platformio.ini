[platformio]
default_envs = dock_devboard
src_dir = pio_src

[env:dock_devboard]
; Same pioarduino platform release as the remote firmware and Sensor_Test,
; kept identical on purpose: the ESP-NOW packet structs shared with
; OpenRemote_1.0.ino (EspNowAnnouncePacket, EspNowCommandHeader, etc.) were
; verified against this release's esp_now.h - esp_now_recv_info_t and the
; IDF5-style recv callback signature. A different platform/core version
; could resolve those headers differently.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; Placeholder target for early bring-up on a bare ESP32 dev board (any
; board with this chip works - swap this once real dock hardware, e.g. an
; ESP32-S3 with a CC1101 module, is chosen).
board = esp32dev
framework = arduino

upload_speed = 460800
monitor_speed = 460800
monitor_filters = time, esp32_exception_decoder
lib_ldf_mode = deep
