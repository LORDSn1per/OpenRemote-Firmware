[platformio]
default_envs = sensor_test_rev5
src_dir = pio_src

[env:sensor_test_rev5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
; Local copy of the firmware's partitions.csv. This pointed at
; ../../OpenRemote/OpenRemote_1.0/partitions.csv, which stopped resolving once
; the firmware moved under "Platformio:Arduino" - and a path containing a colon
; is not worth reaching across for. Keep in step if that layout ever changes.
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

upload_speed = 460800
monitor_speed = 460800

lib_ldf_mode = deep

lib_deps =
    moononournation/GFX Library for Arduino@1.6.6

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

